name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Oldest supported runner, so the Linux binary runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          mkdir -p pkg/FanControl-linux-x86_64/assets
          cp dist/FanControl install.sh README.md LICENSE pkg/FanControl-linux-x86_64/
          cp assets/icon-256.png pkg/FanControl-linux-x86_64/assets/
          mkdir -p pkg/FanControl-linux-x86_64/kmod
          cp kmod/Makefile kmod/ideapad_fan_pwm.c kmod/install.sh pkg/FanControl-linux-x86_64/kmod/
          tar -C pkg -czf FanControl-linux-x86_64.tar.gz FanControl-linux-x86_64
          cp dist/FanControl.exe FanControl-windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: FanControl
          path: |
            FanControl-linux-x86_64.tar.gz
            FanControl-windows-x64.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FanControl-linux-x86_64.tar.gz
            FanControl-windows-x64.exe
